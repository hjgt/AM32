# OpenOCD config for STM32G431 (custom FD6288 ESC board) via ST-Link
# Usage:
#   openocd -f tools/openocd-stm32g431-stlink.cfg
# Then in another terminal:
#   arm-none-eabi-gdb obj/AM32_CUSTOM_FD6288_G431_2.20.elf
#   (gdb) target extended-remote localhost:3333
#
# The ST-Link must be forwarded from Windows into WSL first (usbipd-win).
# See porting notes chapter on toolchain/USB passthrough.

source [find interface/stlink.cfg]

# stlink.cfg auto-detects ST-Link v2 / v2.1 / v3.
# Force SWD (2-wire) transport; the FD6288 board exposes SWDIO/SWCLK only.
transport select hla_swd

source [find target/stm32g4x.cfg]

# Optional: lower adapter speed if the SWD wires are long / noisy.
# adapter speed 480

# Keep GDB happy with multiple connections (flash + live watch).
$_TARGETNAME configure -gdb-max-connections 2

# Convenience proc: flash the freshly built firmware and reset.
# Invoke via telnet (port 4444) or: openocd -f ... -c program_fw
proc program_fw {} {
    program obj/AM32_CUSTOM_FD6288_G431_2.20.elf verify reset
}
