# Live memory access only. Start ONLY after operator confirms throttle zero,
# rotor fully stopped and the installation secured. No halt/reset/flash here.
bindto 127.0.0.1
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32g4x.cfg]
adapter speed 400
reset_config none
# The stock target event writes DBGMCU registers. Do not alter watchdog/timers.
$_TARGETNAME configure -event examine-end {}
gdb_port disabled
telnet_port disabled
tcl_port 6666
